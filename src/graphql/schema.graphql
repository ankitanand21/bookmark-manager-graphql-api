type Folder {
  id: ID!
  name: String!
  createdAt: String!
  bookmarks: [Bookmark!]!
}

type Bookmark {
  id: ID!
  title: String!
  url: String!
  tags: [String!]!
  folderId: ID!
  createdAt: String!
  folder: Folder!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type BookmarkConnection {
  nodes: [Bookmark!]!
  pageInfo: PageInfo!
}

input CreateFolderInput {
  name: String!
}

input CreateBookmarkInput {
  title: String!
  url: String!
  tags: [String!]
  folderId: ID!
}

input UpdateBookmarkInput {
  title: String
  url: String
  tags: [String!]
}

type Query {
  folders: [Folder!]!
  folder(id: ID!): Folder
  bookmarks(folderId: ID, search: String, take: Int, cursor: String): BookmarkConnection!
}

type Mutation {
  createFolder(input: CreateFolderInput!): Folder!
  createBookmark(input: CreateBookmarkInput!): Bookmark!
  updateBookmark(id: ID!, input: UpdateBookmarkInput!): Bookmark!
  deleteBookmark(id: ID!): Boolean!
  moveBookmark(id: ID!, folderId: ID!): Bookmark!
}
