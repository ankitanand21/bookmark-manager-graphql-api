services:
  postgres:
    image: postgres:16-alpine
    container_name: bookmark-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookmarks
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookmarks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
